name: Vérification de l’application

on:
  push:
    branches: [feat/atelier-francais-v1]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # La compilation valide aussi les composants TypeScript.
